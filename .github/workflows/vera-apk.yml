name: VERA Android APK
on:
  push:
    branches: [vera-mvp]
    paths:
      - 'android/**'
      - 'vera_app.py'
      - 'vera_push.py'
      - 'test_vera_push.py'
      - 'vera_cloud.py'
      - 'vera_cloud_ui.js'
      - 'test_vera_cloud.py'
      - 'test_vera_work.py'
      - 'vera_work.py'
      - 'vera_release.py'
      - 'vera_db_backup.py'
      - 'vera_v3*'
      - 'vera_backup*'
      - 'test_vera_backup.mjs'
      - 'sites/vera-bridge/**'
      - 'gunicorn.conf.py'
      - 'requirements-vera.txt'
      - 'vera_ui.html'
      - '.github/workflows/vera-apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish using the verified upgrade signer after staged acceptance.
permissions:
  contents: read
concurrency:
  group: vera-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend smoke checks (mocked credentials)
        run: |
          pip install -r requirements-vera.txt
          python -m py_compile vera_app.py vera_push.py vera_cloud.py vera_work.py vera_release.py vera_db_backup.py gunicorn.conf.py app.py
          python -m unittest -v test_vera_push test_vera_cloud test_vera_work
          python - <<'PY'
          import os
          from unittest.mock import patch, Mock
          from vera_app import app
          os.environ["VERA_ACCESS_TOKEN"]="ci-only-token-not-a-secret"
          os.environ["OPENAI_API_KEY"]="mock-test-key"
          c=app.test_client()
          h={"Authorization":"Bearer ci-only-token-not-a-secret"}
          assert c.get("/health").json["status"]=="ok"
          assert c.get("/app").status_code==200
          assert c.post("/api/status").status_code==401
          assert c.post("/api/status",headers=h).json["configured"]
          assert c.post("/api/realtime/call",headers=h,json={"sdp":"bad"}).status_code==400
          with patch("vera_app.requests.post",return_value=Mock(ok=True,text="v=0\r\n")):
              assert c.post("/api/realtime/call",headers=h,json={"sdp":"v=0\r\n"}).json["sdp"].startswith("v=0")
          with patch("vera_app.requests.post",return_value=Mock(ok=True,**{"json.return_value":{"output":[{"type":"message","content":[{"type":"output_text","text":"test summary"}]}]}})):
              assert c.post("/api/summary",headers=h,json={"transcript":"test"}).json["summary"]=="test summary"
          assert c.post("/api/assistant/organize",json={"mode":"brief","data":"test"}).status_code==401
          assert c.post("/api/tasks/revise",headers=h,json={"tasks":[]}).status_code==400
          with patch("vera_app.requests.post",return_value=Mock(ok=True,**{"json.return_value":{"output":[{"type":"message","content":[{"type":"output_text","text":'{"changes":[{"id":"t1","action":"complete","title":"","reason":"confirmed"}]}' }]}]}})):
              assert c.post("/api/tasks/revise",headers=h,json={"tasks":[{"id":"t1","title":"test"}],"transcript":"completed"}).json["changes"][0]["id"]=="t1"
          with patch("vera_app.requests.post",return_value=Mock(ok=True,**{"json.return_value":{"output":[{"type":"message","content":[{"type":"output_text","text":"brief test"}]}]}})):
              assert c.post("/api/assistant/organize",headers=h,json={"mode":"brief","data":"test"}).json["text"]=="brief test"
          from vera_app import session
          assert session("test",{"voice":"coral","speed":1.15})["audio"]["output"]=={"voice":"coral","speed":1.15}
          print("All mocked backend smoke checks passed.")
          PY
      - name: Validate UI JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("vera_ui.html").read_text()
          Path("/tmp/vera.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/vera.js
          node --check vera_cloud_ui.js
          node --check vera_v3_ui.js
          node --test sites/vera-bridge/worker.test.mjs
          node --test test_vera_backup.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        env:
          VERA_FIREBASE_ANDROID_CONFIG: ${{ vars.VERA_FIREBASE_ANDROID_CONFIG }}
          PUBLISH: ${{ inputs.publish == true }}
          KEYSTORE_B64: ${{ secrets.VERA_SIGNING_KEYSTORE_BASE64 }}
          VERA_SIGNING_STORE_PASSWORD: ${{ secrets.VERA_SIGNING_STORE_PASSWORD }}
          VERA_SIGNING_ALIAS: ${{ secrets.VERA_SIGNING_ALIAS }}
          VERA_SIGNING_KEY_PASSWORD: ${{ secrets.VERA_SIGNING_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [[ -n "$VERA_FIREBASE_ANDROID_CONFIG" ]]; then
            printf '%s' "$VERA_FIREBASE_ANDROID_CONFIG" > app/google-services.json
          else
            echo '::notice::Android Firebase config unavailable; the build supports local reminders only.'
          fi
          if [[ "$PUBLISH" == true ]]; then
            test -s app/google-services.json
            test -n "$KEYSTORE_B64"
            test -n "$VERA_SIGNING_STORE_PASSWORD"
            test -n "$VERA_SIGNING_ALIAS"
            test -n "$VERA_SIGNING_KEY_PASSWORD"
            umask 077
            export VERA_SIGNING_FILE="$(mktemp)"
            trap 'rm -f "$VERA_SIGNING_FILE"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$VERA_SIGNING_FILE"
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../VERA-Nexus.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../VERA-Nexus.apk
          fi
      - name: Verify APK and upgrade signer
        env:
          PUBLISH: ${{ inputs.publish == true }}
          EXPECTED_SIGNER: ${{ vars.VERA_UPGRADE_CERT_SHA256 }}
        run: |
          signer="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs VERA-Nexus.apk | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')"
          test -n "$signer"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging VERA-Nexus.apk > "$RUNNER_TEMP/vera-manifest.txt"
          grep -q "package: name='tw.vera.nexus' versionCode='11' versionName='0.3.0'" "$RUNNER_TEMP/vera-manifest.txt"
          sha256sum VERA-Nexus.apk > VERA-Nexus.apk.sha256
          if [[ "$PUBLISH" == true ]]; then
            test "$GITHUB_REF" = 'refs/heads/vera-mvp'
            if [[ -z "$EXPECTED_SIGNER" ]]; then
              EXPECTED_SIGNER=090145966eb3fa965d896e9ff7dcff09d54b418349b11ba8639a2ffcce41be4e
            fi
            test "$signer" = "${EXPECTED_SIGNER,,}"
            printf '{"package":"tw.vera.nexus","version":"0.3.0","version_code":11,"firebase":true,"signer_sha256":"%s","apk_sha256":"%s"}\n' "$signer" "$(cut -d ' ' -f 1 VERA-Nexus.apk.sha256)" > vera-release.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VERA-Nexus-APK
          path: |
            VERA-Nexus.apk
            VERA-Nexus.apk.sha256
            vera-release.json
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == 'vera-mvp'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VERA-Nexus-APK
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c VERA-Nexus.apk.sha256
          test -s vera-release.json
          tag="vera-nexus-v0.3.0-fcm-${GITHUB_RUN_NUMBER}-r${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" VERA-Nexus.apk VERA-Nexus.apk.sha256 vera-release.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VERA Nexus 0.3.0" \
            --notes-file - <<'EOF'
          Firebase client config embedded. Uses the verified VERA APK signer.
          Includes the secretary workspace, task exchange, automatic call summaries, and private cloud memory.
          EOF
